<!DOCTYPE html>
<html>

<head>

    <title>Staff Sign In</title>

    <link rel="stylesheet" href="jump.css">

</head>

<body class="staff-page">
<div class="container">

    <h1>Staff Sign In</h1>

    <label>Name</label>
<br>

<select id="name">
    <option value="">Select Your Name</option>
    <option>Charles Kabiru</option>
    <option>Fidel Castro</option>
    <option>Madam Serrah</option>
    <option>Madam Ann</option>
    <option>Madam Leah</option>
</select>

<br><br>

<label>PIN</label>
<br>

<input
    type="password"
    id="pin"
    placeholder="Enter PIN">

<br><br>

<label>Action</label>
<br>

<select id="action">
    <option value="">Select Action</option>
    <option>Sign In</option>
    <option>Sign Out</option>
</select>

<br><br>

<button id="submitBtn">
    Submit
</button>

<br><br>

<button onclick="location.href='index.html'">
    ⬅ Back
</button>

</div>

<script src="fia.js"></script>

</body>

</html>
