<!DOCTYPE html>
<html>

<head>

    <title>Visitor Sign In</title>

    <link rel="stylesheet" href="hmm.css">

</head>

<body class="visitor-page">

<div class="container">

    <h1>Visitor Sign In</h1>

<p>Please fill in your details below.</p>

    <label>Full Name</label>
    <br>
    <input type="text" id="name" placeholder="Enter Full Name">

    <br><br>

    <label>Phone Number</label>
    <br>
    <input type="text" id="phone" placeholder="07XXXXXXXX">

    <br><br>

    <label>Office to Visit</label>
    <br>

    <select id="office">
        <option>Select Office</option>
        <option>Reception</option>
        <option>Accounts</option>
        <option>ICT</option>
        <option>Principal</option>
    </select>

    <br><br>

    <label>Reason for Visit</label>
    <br>
    <input type="text" id="reason" placeholder="Reason for Visit">

    <br><br>

    <button id="submitBtn">Submit</button>

    <br>

    <button onclick="location.href='index.html'">⬅ Back</button>

</div>

<script src="script.js"></script>

</body>

</html>
